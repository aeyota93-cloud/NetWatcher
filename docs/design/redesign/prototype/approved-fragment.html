function addressTable(s){const global=s.route==='connections',rows=filteredRows(s);return `<div class="connection-table"><div class="selectionbar" ${s.checked.length?'':'hidden'}><span data-selection-count>Выбрано: ${s.checked.length}</span><div class="row">${act('copy-selected:rows','Копировать строки','','copy')}${act('copy-selected:ip','IP','','copy')}${act('copy-selected:domains','Домены','','copy')}${act('clear-selection','Снять выбор','ghost')}</div></div><div class="tablewrap"><table class="connections-table ${global?'global-table':''}"><thead><tr><th class="checkcell"><input type="checkbox" data-check-all aria-label="Выбрать все найденные соединения" ${rows.length&&rows.every(r=>s.checked.includes(r.id))?'checked':''}></th>${global?'<th>Программа / служба</th>':''}<th>${s.group==='addresses'?'IP-адрес':'Домен и IP-адрес'}</th><th>Протокол</th><th>Порт</th><th>Связь</th><th class="num">Объём</th><th class="copyhead">Копировать</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="${s.checked.includes(r.id)?'checked':''}" data-row-id="${r.id}"><td class="checkcell"><input type="checkbox" data-check-row="${r.id}" aria-label="Выбрать ${apps[r.appIndex].name}, ${r.ip}, ${r.port}" ${s.checked.includes(r.id)?'checked':''}></td>${global?`<td><button type="button" class="textlink" data-act="app:${r.appIndex}">${apps[r.appIndex].name}</button><div class="table-sub">${apps[r.appIndex].exe}${apps[r.appIndex].type==='service'?' · служба':''}</div></td>`:''}<td class="address-cell">${s.group==='domains'&&r.domain!==r.ip?`<div class="inline-address"><button type="button" class="textlink domain-name" data-act="detail-id:${r.id}">${r.domain}</button>${copyButton('row-copy:domains:'+r.id,'Копировать домен '+r.domain)}</div>`:''}<div class="inline-address"><button type="button" class="textlink mono" data-act="detail-id:${r.id}">${r.ip}</button>${copyButton('row-copy:ip:'+r.id,'Копировать IP '+r.ip)}</div><div class="table-sub owner">${r.owner}</div></td><td><span class="protocol ${r.protocol.toLowerCase()}">${r.protocol}</span></td><td class="mono">${r.rawPort}</td><td><span class="${r.bad?'badge warn':'small muted'}">${r.status}</span></td><td class="num">${r.traffic}</td><td class="copycell">${copyButton('row-copy:rows:'+r.id,'Копировать соединение целиком','copy')}${copyButton('actions-id:'+r.id,'Действия с соединением','ellipsis')}</td></tr>`).join(''):`<tr><td colspan="${global?9:8}"><div class="empty"><h3>Соединений по этим условиям нет</h3><p class="muted">Измените запрос или сбросьте фильтры.</p>${act('reset-filters','Сбросить поиск и фильтры')}</div></td></tr>`}</tbody></table></div><div class="tablefoot"><span>${global?'Все приложения и службы':'Только '+apps[s.app].name} · ${s.period}</span><span>IP и домен копируются рядом с адресом</span></div></div>`;}
function dnsTable(s){let a=apps[s.app];return `<div class="tablewrap"><table><thead><tr><th>Запрошенное имя</th><th>Ответ DNS</th><th>Когда</th></tr></thead><tbody>${s.app===0?'<tr><td colspan="3">Для этих соединений Telegram имена не определены.<div class="table-sub">Программа может обращаться по IP или использовать собственный DNS.</div></td></tr>':`<tr><td>${s.app===1?'youtube.com':'discord.com'}</td><td class="mono">${currentRows(s)[0].ip}</td><td>14:31</td></tr>`}</tbody></table></div>`;}
function linkContent(s){let a=apps[s.app];return `<div class="panelbody"><div class="row between"><h2>${s.app===0?'Один сервер не отвечает':'Серверы отвечают'}</h2>${act('notify','Уведомлять о сбоях','','bell')}</div><p class="muted small" style="margin-top:7px">${s.app===0?'Данные отправляются, ответа от 149.154.167.51 нет 18 секунд. Другие серверы отвечают.':'За последний час пропусков ответов в примере нет.'}</p>${chart()}${s.app===0?'<div class="insight">Повторные отправки TCP совпали с пропажей ответов. Причина пока неизвестна.</div>':''}</div>${addressTable(s)}`;}
function appsPage(s){const a=apps[s.app];return `<div class="heading compact-heading"><div><h1>Программы</h1><p>Соединения и связь выбранной программы.</p></div><div class="row">${act('toggle-list',s.listHidden?'Показать список':'Скрыть список','','panel-left')}${act('export','Экспорт списка','primary','arrow-up-from-line')}</div></div><div class="data-layout ${s.listHidden?'list-hidden':''}" style="--program-width:${s.programWidth}px"><section class="panel program-panel" aria-label="Список программ"><div class="program-title"><h2>Программы и службы</h2><div class="row">${copyButton('narrow-list','Сузить список','chevron-left')}${copyButton('widen-list','Расширить список','chevron-right')}</div></div><div class="program-search"><div class="search">${icon('search')}<input data-input="program" aria-label="Найти программу или службу" placeholder="Найти программу"></div></div>${appList(s,true)}<div class="program-foot small muted">6 программ и служб · примеры</div></section><div class="splitter" role="separator" aria-orientation="vertical" aria-label="Изменить ширину списка программ" data-resize-programs>${icon('grip-vertical')}</div><div class="workspace"><section class="panel"><div class="program-summary"><div class="row">${avatar(a)}<div><h2>${a.name}</h2><span class="small muted">${a.exe} · ${a.addr} соединений в примере</span></div></div><div class="row">${act('notify','Уведомления','ghost','bell')}${act('app-menu','Действия','','ellipsis')}</div></div><div class="program-metrics"><span>Трафик <b>${a.traffic}</b></span><span>Задержка <b>${s.app===0?'42':'28'} мс</b></span><span>Потери проб <b>${s.app===0?'—':'0%'}</b></span>${s.app===0?'<span class="badge warn">1 сервер без ответа</span>':'<span class="badge"><span class="dot"></span>Ответы приходят</span>'}</div><div class="tabs">${[['addresses','Соединения'],['link','Связь'],['dns','DNS']].map(([v,n])=>act('tab:'+v,n,s.tab===v?'selected':'')).join('')}</div>${s.tab==='link'?linkContent(s):s.tab==='dns'?dnsTable(s):searchBar(s)+addressTable(s)}</section><div class="contextbar bottom-context"><div class="row">${live(s)}</div>${periods(s)}</div></div></div>${footer(s)}`;}
function diagnostics(s){return `<div class="heading"><div><div class="eyebrow">Инструменты</div><h1>Проверка соединения</h1><p>Узнайте, на каком этапе нет ответа.</p></div><span class="badge">Результаты в макете — пример</span></div><div class="stack"><section class="panel"><div class="panelbody"><label>Сайт или IP-адрес<div class="row" style="align-items:stretch"><input data-input="target" placeholder="Например, github.com" value="github.com" style="flex:1;min-width:160px">${act('run-check','Проверить','primary','scan-line')}</div></label><p class="route-note">Проверка DNS, подключения, сертификата и пути до сервера.</p><div data-result="check" hidden style="margin-top:20px"><div class="insight" style="background:var(--soft);color:var(--ink)">В примере сайт отвечает. Ошибок DNS и сертификата не найдено.</div>${[['DNS','Имя определено · 140.82.121.3'],['Подключение','Ответ получен · TCP 443'],['Сертификат','Соответствует имени сайта'],['Путь до сервера','35 мс · 10 проб на узел']].map(([n,v])=>`<div class="step"><h3>${n}</h3><span class="ok">${v}</span></div>`).join('')}<div class="row" style="margin-top:16px">${act('copy-report','Копировать отчёт','','copy')}${act('trace','Показать путь по узлам','ghost','route')}</div></div></div></section><section class="panel"><div class="paneltop"><h2>Качество подключения</h2><span class="small muted">Наблюдение без дополнительной нагрузки</span></div><div class="panelbody"><div class="appstats"><div class="muted small">До роутера<strong style="color:var(--ink)">2 мс</strong></div><div class="muted small">До интернета<strong style="color:var(--ink)">42 мс</strong></div><div class="muted small">Разброс задержки<strong style="color:var(--ink)">6 мс</strong></div></div><p class="muted">Проверьте, как меняется задержка при скачивании и отправке.</p><div class="row" style="margin-top:18px">${act('loadtest','Проверить под нагрузкой','','gauge')}<span class="small muted">До 350 МБ трафика · около 20 секунд</span></div></div></section></div>${footer(s)}`;}
function rules(s){return `<div class="heading"><div><h1>Блокировки</h1><p>Правила исходящих соединений в брандмауэре Windows.</p></div><span class="badge">2 правила в примере</span></div><section class="panel"><div class="paneltop"><h2>Действующие правила</h2><span class="small muted">Сохраняются после закрытия NetWatcher</span></div><div class="tablewrap"><table><thead><tr><th>Что заблокировано</th><th>Для кого</th><th>Действие</th></tr></thead><tbody><tr data-rule><td><h3>example-tracker.test</h3><div class="table-sub">По известным IP-адресам домена</div></td><td>Google Chrome</td><td>${act('unblock','Снять блокировку','ghost','shield-off')}</td></tr><tr data-rule><td><h3>203.0.113.42</h3><div class="table-sub">Один IP-адрес</div></td><td>Все программы</td><td>${act('unblock','Снять блокировку','ghost','shield-off')}</td></tr></tbody></table></div><div class="panelbody muted small">Чтобы создать правило, выберите программу или адрес и откройте «Действия». Перед блокировкой вы увидите её область и последствия.</div></section>${footer(s)}`;}
function settings(s){return `<div class="heading"><div><h1>Настройки</h1><p>Хранение журнала, уведомления и оформление.</p></div></div><section class="panel"><div class="panelbody stack"><div class="formgrid"><label>Тема<select data-select="theme"><option value="system">Как в системе</option><option value="light">Светлая тема</option><option value="dark">Тёмная тема</option></select></label><label>Хранить журнал<select><option>7 дней</option><option>30 дней</option><option>1 день</option></select></label></div><label class="checkline"><input type="checkbox" checked>Сообщать о новых программах в сети</label><label class="checkline"><input type="checkbox">Сообщать о первой стране или сети у программы</label><p class="small muted">Уведомления о пропаже ответов включаются отдельно для выбранной программы.</p><div class="step"><div><h3>Справочники</h3><span class="muted small">Владельцы сетей, страны и категории доменов</span></div>${act('update-db','Обновить')}</div><div class="step"><div><h3>Обновления NetWatcher</h3><span class="muted small">Проверка при запуске и раз в сутки</span></div>${act('update-app','Проверить')}</div><div>${act('save-settings','Сохранить настройки','primary')}</div></div></section>${footer(s)}`;}
function shellA(s){const nav=[['overview','Обзор','layout-dashboard'],['apps','Программы','app-window'],['connections','Все соединения','network'],['diagnostics','Проверки','scan-line'],['rules','Блокировки','shield']];const navbutton=(v,n,i)=>`<button type="button" data-act="route:${v}" class="${s.route===v?'selected':''}" aria-label="${n}" ${s.navCollapsed?`data-tooltip="${n}" data-tooltip-placement="right"`:''}>${icon(i)}<span class="navtext">${n}</span></button>`;return `<div class="titlebar"><span>NetWatcher <span class="titlepath">/ ${nav.find(n=>n[0]===s.route)?.[1]||'Настройки'}</span></span><span>Макет · демонстрационные данные</span><div class="row"><select data-select="theme" aria-label="Тема оформления"><option value="system" ${s.theme==='system'?'selected':''}>Как в системе</option><option value="light" ${s.theme==='light'?'selected':''}>Светлая тема</option><option value="dark" ${s.theme==='dark'?'selected':''}>Тёмная тема</option></select><span class="windowmarks">— □ ×</span></div></div><div class="a-shell ${s.navCollapsed?'nav-collapsed':''}"><aside class="a-sidebar"><div class="brand"><span class="brandmark">${icon('activity')}</span><span class="brandtext">NetWatcher</span></div><button type="button" class="nav-toggle" data-act="toggle-nav" aria-label="${s.navCollapsed?'Развернуть меню':'Свернуть меню'}" aria-expanded="${!s.navCollapsed}" data-tooltip="${s.navCollapsed?'Развернуть меню':'Свернуть меню'}">${icon(s.navCollapsed?'panel-left-open':'panel-left-close')}<span class="navtext">Свернуть меню</span></button><nav class="navgroup" aria-label="Разделы NetWatcher"><div class="navlabel">Наблюдение</div>${nav.map(([v,n,i])=>navbutton(v,n,i)).join('')}</nav><div class="spacer"></div><div class="navgroup">${navbutton('settings','Настройки','settings')}<button type="button" data-act="help" aria-label="Как пользоваться" ${s.navCollapsed?'data-tooltip="Как пользоваться"':''}>${icon('circle-help')}<span class="navtext">Как пользоваться</span></button></div><div class="sidebar-foot"><span class="dot"></span><span class="navtext">На этом компьютере<br>Журнал хранится 7 дней</span></div></aside><main class="a-main">${s.route==='overview'?overview(s):s.route==='apps'?appsPage(s):s.route==='connections'?connectionsPage(s):s.route==='diagnostics'?diagnostics(s):s.route==='rules'?rules(s):settings(s)}</main></div>`;}
function render(id='a'){const el=document.getElementById('nw-a'),s=state.a;el.dataset.theme=s.theme;if(s.theme==='system')el.style.removeProperty('color-scheme');else el.style.colorScheme=s.theme;el.innerHTML=shellA(s);el.querySelectorAll('[data-select="theme"]').forEach(v=>v.value=s.theme);icons();}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function toast(el,text){el.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;el.append(t);setTimeout(()=>t.remove(),4200);}
function sheet(el,title,body){el.querySelector('.overlay')?.remove();const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="row between"><h2>${title}</h2>${act('close-sheet','Закрыть','ghost','x')}</div>${body}</section>`;ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});el.append(ov);icons();ov.querySelector('button')?.focus();}
function details(el,s){const r=selectedRow(s),a=apps[r.appIndex];sheet(el,'Сведения о соединении',`<div class="row between"><span class="badge ${r.bad?'warn':''}">${r.status}</span><span class="small muted">${a.name}</span></div><h2 class="mono">${r.ip}</h2><div class="keyvals"><div class="keyval"><span class="key">Домен</span><div class="row"><span>${r.domain===r.ip?'Не определён':r.domain}</span>${r.domain!==r.ip?copyButton('row-copy:domains:'+r.id,'Копировать домен'):''}</div></div><div class="keyval"><span class="key">Владелец</span><span>${r.owner}</span></div><div class="keyval"><span class="key">Протокол и порт</span><span>${r.port}</span></div><div class="keyval"><span class="key">Сеть и страна</span><span>${r.network} · ${r.country}</span><span class="small muted">Страна по IP · справочник может ошибаться</span></div><div class="keyval"><span class="key">Первое / последнее обращение</span><span>Сегодня, 13:48 / 14:32</span></div></div><div class="row">${act('row-copy:ip:'+r.id,'Копировать IP','','copy')}${act('check-address','Проверить','primary','scan-line')}${act('row-menu','Действия','','ellipsis')}</div><div class="row">${act('rdap','Данные реестра','ghost','database')}${act('peering','Уточнить владельца','ghost','building-2')}</div>`);}
function exportSheet(el,s){sheet(el,'Экспорт списка',`<p class="muted">${s.route==='connections'?'Все программы и службы':apps[s.app].name} · ${s.period}. Только найденные соединения.</p><div class="formgrid"><label>Что сохранить<select data-select="export-kind"><option value="ip">IP-адреса</option><option value="domains">Домены</option><option value="subnets">Подсети</option><option value="owners">Сети владельцев</option></select></label><label>Формат<select data-select="export-format"><option value="lines">Список по строкам</option><option value="wg">WireGuard / AmneziaWG</option><option value="fw">Брандмауэр Windows</option><option value="mask">Для роутера · с маской</option></select></label></div><label>Насколько укрупнять<select data-select="export-prefix"><option value="32">Точные адреса</option><option value="28">/28</option><option value="24">/24</option><option value="20">/20</option><option value="16">/16</option></select></label><p class="small muted">Чем шире сеть, тем больше соседних адресов попадёт в список.</p><div class="row"><label class="checkline"><input type="checkbox" checked data-input="export-ipv4">Только IPv4</label><label class="checkline"><input type="checkbox" data-input="export-comments">Комментарии с доменами</label></div><div><h3>Предпросмотр</h3><pre class="preview" data-export-preview style="margin-top:9px"></pre><p class="small muted" data-export-summary style="margin-top:8px"></p></div><div class="row">${act('copy-export','Копировать','primary','copy')}${act('save-export','Сохранить .txt','','download')}</div>`);updateExport(el,s);}
function updateExport(el,s){const kind=el.querySelector('[data-select="export-kind"]')?.value;if(!kind)return;const fmt=el.querySelector('[data-select="export-format"]').value;const prefix=Number(el.querySelector('[data-select="export-prefix"]').value);let rows=filteredRows(s),values=[];if(kind==='domains')values=rows.filter(r=>r.domain!==r.ip).map(r=>r.domain);else values=rows.map(r=>{if(kind==='owners')return r.network;let p=kind==='subnets'&&prefix===32?24:prefix;let oct=r.ip.split('.').map(Number),n=((oct[0]*16777216)+(oct[1]*65536)+(oct[2]*256)+oct[3])>>>0;let base=p===32?n:Math.floor(n/2**(32-p))*2**(32-p);let ip=[(base>>>24)&255,(base>>>16)&255,(base>>>8)&255,base&255].join('.');return kind==='ip'&&p===32?ip:ip+'/'+p;});values=[...new Set(values)];let compatible=kind!=='domains'||fmt==='lines';let text=!compatible?'Этот формат использует IP-адреса и сети. Выберите другой тип данных.':!values.length?'Известных доменов для выбранной программы нет.':fmt==='wg'?'AllowedIPs = '+values.map(v=>v.includes('/')?v:v+'/32').join(', '):fmt==='fw'?values.join(', '):fmt==='mask'?values.map(v=>{let [ip,p='32']=v.split('/');let m=Number(p)===0?0:(0xffffffff<<(32-Number(p)))>>>0;return ip+' '+[(m>>>24)&255,(m>>>16)&255,(m>>>8)&255,m&255].join('.')}).join('\n'):values.join('\n');if(compatible&&values.length&&el.querySelector('[data-input="export-comments"]').checked&&fmt==='lines')text='# '+(s.route==='connections'?'Все программы и службы':apps[s.app].name)+'\n'+text;el.querySelector('[data-export-preview]').textContent=text;el.querySelector('[data-export-summary]').textContent=values.length+' строк · примеры данных';el.dataset.exportText=text;el.dataset.exportValid=String(compatible&&values.length>0);el.querySelector('[data-act="copy-export"]').disabled=!(compatible&&values.length);el.querySelector('[data-act="save-export"]').disabled=!(compatible&&values.length);}
function filterSheet(el,s){sheet(el,'Фильтры соединений',`<div class="formgrid"><label>Протокол<select data-filter="protocol"><option value="all">TCP и UDP</option><option value="TCP" ${s.protocol==='TCP'?'selected':''}>TCP</option><option value="UDP" ${s.protocol==='UDP'?'selected':''}>UDP</option></select></label><label>Домены<select data-filter="domains"><option value="all">Все</option><option value="known" ${s.domainMode==='known'?'selected':''}>Домен определён</option><option value="unknown" ${s.domainMode==='unknown'?'selected':''}>Без домена</option></select></label></div><label class="checkline"><input type="checkbox" data-filter="bad" ${s.onlybad?'checked':''}>Только без ответа</label><p class="small muted">Поиск, тип программы и фильтры применяются вместе.</p><div class="row">${act('apply-filter','Применить','primary')}${act('reset-filters','Сбросить всё','ghost')}</div>`);}
function menu(el,s,isApp){sheet(el,isApp?'Действия с программой':'Действия с адресом',`<p class="muted">${isApp?apps[s.app].name:selectedRow(s).ip}</p><div class="stack">${act('copy-ip','Копировать IP','','copy')}${act('copy-row','Копировать строки','','copy')}${act('copy-domain','Копировать домены','','copy')}${act('copy-network','Копировать сеть','','copy')}${act('find-ip','Найти все обращения к IP','','search')}${act('find-domain','Найти по домену','','search')}${act('check-address','Проверить соединение','','scan-line')}${isApp?act('folder','Открыть папку программы','','folder-open'):''}${act('block','Заблокировать…','','shield')}${act('disconnect','Разорвать соединение…','','unplug')}</div>`);}
async function copy(el,text){try{await navigator.clipboard.writeText(text);toast(el,'Скопировано');return true;}catch{sheet(el,'Текст для копирования',`<p class="muted">Выделите текст и нажмите Ctrl+C.</p><textarea rows="6" aria-label="Текст для копирования" style="width:100%;background:var(--bg);color:var(--ink);padding:12px">${esc(text)}</textarea>`);el.querySelector('textarea').select();return false;}}
function currentRows(s){return s.route==='connections'?connections:connections.filter(r=>r.appIndex===s.app);}
function selectedRow(s){return connections.find(r=>r.id===s.selectedId)||selectedRow(s)||currentRows(s)[0];}
function filteredRows(s){return currentRows(s).filter(r=>{
 const a=apps[r.appIndex];
 if(s.onlybad&&!r.bad)return false;
 if(s.route==='connections'&&s.scope!=='all'&&a.type!==s.scope)return false;
 if(s.protocol&&s.protocol!=='all'&&r.protocol!==s.protocol)return false;
 if(s.domainMode==='known'&&r.domain===r.ip)return false;
 if(s.domainMode==='unknown'&&r.domain!==r.ip)return false;
 const hay=[r.domain,r.ip,r.owner,r.protocol,r.rawPort,r.country,r.network,a.name,a.exe].join(' ').toLowerCase();
 return s.query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(t=>/^\d+$/.test(t)?String(r.rawPort)===t:hay.includes(t));
});}
function searchBar(s,global=false){return `<div class="filters"><div class="search">${icon('search')}<input data-input="query" aria-label="Поиск по домену, IP, владельцу, протоколу и порту" placeholder="Домен, IP, владелец, UDP или 443" value="${esc(s.query)}">${s.query?act('clear-query','Сбросить поиск','iconbtn','x'):''}</div>${global?`<select data-select="scope" aria-label="Тип программы"><option value="all" ${s.scope==='all'?'selected':''}>Программы и службы</option><option value="app" ${s.scope==='app'?'selected':''}>Приложения</option><option value="service" ${s.scope==='service'?'selected':''}>Службы Windows</option></select>`:''}<select data-select="group" aria-label="Вид соединений"><option value="domains" ${s.group==='domains'?'selected':''}>Домены и IP</option><option value="addresses" ${s.group==='addresses'?'selected':''}>Только IP</option></select>${act('filter','Фильтры',(s.onlybad||s.protocol!=='all'||s.domainMode!=='all')?'selected':'','sliders-horizontal')}</div><div class="search-hint"><span>Можно сочетать условия: <button type="button" data-act="example:UDP 443">UDP 443</button></span><span data-result-count aria-live="polite">${resultCount(s)}</span></div>`;}
function resultCount(s){return `Найдено ${filteredRows(s).length} из ${currentRows(s).length} соединений`;}
function copyButton(action,label,ico='copy'){return `<button type="button" class="iconbtn rowcopy" data-act="${action}" aria-label="${label}" data-tooltip="${label}">${icon(ico)}</button>`;}
function connectionsPage(s){return `<div class="heading compact-heading"><div><h1>Все соединения</h1><p>Общий список приложений и служб Windows.</p></div>${act('export','Экспорт списка','primary','arrow-up-from-line')}</div><div class="contextbar"><span class="scope-info">${connections.length} соединений · ${apps.length} программ и служб</span>${periods(s)}</div><section class="panel all-connections">${searchBar(s,true)}${addressTable(s)}</section><div class="contextbar bottom-context"><div class="row">${live(s)}</div><span class="small muted">Нажмите на программу, чтобы перейти к её соединениям</span></div>${footer(s)}`;}
function refreshTable(el,s){const table=el.querySelector('.connection-table');if(table)table.outerHTML=addressTable(s);const count=el.querySelector('[data-result-count]');if(count)count.textContent=resultCount(s);icons();}
function copyRowsText(rows,kind){if(kind==='ip')return [...new Set(rows.map(r=>r.ip))].join('\n');if(kind==='domains')return [...new Set(rows.filter(r=>r.domain!==r.ip).map(r=>r.domain))].join('\n');return rows.map(r=>[apps[r.appIndex].name,apps[r.appIndex].exe,r.domain===r.ip?'':r.domain,r.ip,r.protocol,r.rawPort,r.owner,r.traffic,r.status].join('\t')).join('\n');}
function remember(){const s=state.a;if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{direction:'Панель наблюдения',theme:s.theme},privateContent:{theme:s.theme,programWidth:s.programWidth}}).catch(()=>{});}
root.addEventListener('click',async e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const el=btn.closest('.nw');const id=el.id.endsWith('a')?'a':'b';const s=state[id];const [action,...args]=btn.dataset.act.split(':');const val=args.join(':');
 if(action==='toggle-nav'){s.navCollapsed=!s.navCollapsed;render(id);return;}
 if(action==='toggle-list'){s.listHidden=!s.listHidden;render(id);return;}
 if(action==='narrow-list'||action==='widen-list'){const layout=el.querySelector('.data-layout');const max=Math.max(190,Math.min(330,layout.clientWidth-365));s.programWidth=Math.max(190,Math.min(max,s.programWidth+(action==='widen-list'?30:-30)));render(id);remember();return;}
 if(action==='example'){s.query=val;s.checked=[];render(id);return;}
 if(action==='clear-query'){s.query='';s.checked=[];render(id);el.querySelector('[data-input="query"]')?.focus();return;}
 if(action==='reset-filters'){s.query='';s.onlybad=false;s.protocol='all';s.domainMode='all';s.scope='all';s.checked=[];render(id);return;}
 if(action==='clear-selection'){s.checked=[];refreshTable(el,s);return;}
 if(action==='detail-id'||action==='actions-id'){const r=connections.find(r=>r.id===Number(val));s.selectedId=r.id;s.app=r.appIndex;s.selected=currentRows(s).indexOf(r);if(action==='detail-id')details(el,s);else menu(el,s,false);return;}
 if(action==='row-copy'){const [kind,rowId]=args;const r=connections.find(r=>r.id===Number(rowId));const text=copyRowsText([r],kind);if(!text){toast(el,'Для этого соединения домен не определён');return;}if(await copy(el,text))toast(el,kind==='ip'?'IP скопирован: '+text:kind==='domains'?'Домен скопирован: '+text:'Соединение скопировано');return;}
 if(action==='copy-selected'){const rows=filteredRows(s).filter(r=>s.checked.includes(r.id));const text=copyRowsText(rows,val);if(!text){toast(el,'У выбранных соединений домены не определены');return;}if(await copy(el,text))toast(el,val==='ip'?'Скопированы IP: '+text.split('\n').length:val==='domains'?'Скопированы домены: '+text.split('\n').length:'Скопировано соединений: '+rows.length);return;}

 if(action==='route'){s.route=val;s.navCollapsed=['apps','connections'].includes(val);s.query='';s.checked=[];s.selected=0;s.selectedId=null;s.protocol='all';s.domainMode='all';s.onlybad=false;render(id);return;}
 if(action==='app'){s.app=Number(val);s.navCollapsed=true;s.checked=[];s.selectedId=null;s.protocol='all';s.domainMode='all';s.selected=0;s.query='';s.onlybad=false;s.tab=id==='a'?'addresses':'link';s.route=id==='a'?'apps':'workspace';render(id);return;}
 if(action==='tab'){s.tab=val;render(id);return;}
 if(action==='period'){s.period=val;render(id);toast(el,'Выбран период «'+val+'». В макете данные не пересчитываются.');return;}
 if(action==='pause'){s.paused=!s.paused;render(id);return;}
 if(action==='close-sheet'){el.querySelector('.overlay')?.remove();return;}
 if(action==='detail'){s.selected=Number(val);if(id==='b')render(id);details(el,s);return;}
 if(action==='export'){exportSheet(el,s);return;}
 if(action==='filter'){filterSheet(el,s);return;}
 if(action==='apply-filter'){s.onlybad=!!el.querySelector('[data-filter="bad"]')?.checked;s.protocol=el.querySelector('[data-filter="protocol"]').value;s.domainMode=el.querySelector('[data-filter="domains"]').value;s.checked=[];render(id);return;}
 if(action==='app-menu'||action==='row-menu'){menu(el,s,action==='app-menu');return;}
 if(action==='copy-export'){await copy(el,el.dataset.exportText);return;}
 if(action==='save-export'){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([el.dataset.exportText],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='netwatcher-example.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(el,'Сохранён список с примерами адресов');return;}
 if(['copy-ip','copy-row','copy-domain','copy-network'].includes(action)){const r=selectedRow(s);if(action==='copy-domain'&&r.domain===r.ip){toast(el,'Для этого соединения домен не определён');return;}await copy(el,action==='copy-ip'?r.ip:action==='copy-domain'?r.domain:action==='copy-network'?r.network:copyRowsText([r],'rows'));return;}
 if(action==='find-ip'||action==='find-domain'){const r=selectedRow(s);s.route='connections';s.navCollapsed=true;s.query=action==='find-domain'&&r.domain!==r.ip?r.domain:r.ip;s.tab=id==='a'?'addresses':'link';render(id);return;}
 if(action==='check-address'){s.selectedId=selectedRow(s).id;s.route='diagnostics';render(id);el.querySelector('[data-input="target"]').value=selectedRow(s).ip;return;}
 if(action==='run-check'){const target=el.querySelector('[data-input="target"]').value.trim();if(!target){toast(el,'Введите сайт или IP-адрес');return;}el.querySelector('[data-result="check"]').hidden=false;toast(el,'Показан пример результата. Сетевые запросы не выполняются.');return;}
 if(action==='copy-report'){await copy(el,'NetWatcher — пример отчёта\nЦель: '+el.querySelector('[data-input="target"]').value+'\nDNS: имя определено\nTCP 443: ответ получен\nСертификат: соответствует имени\nЗадержка: 35 мс\nЭто демонстрационные данные.');return;}
 if(action==='trace'){sheet(el,'Путь до сервера',`<p class="muted">Пример · 10 проб на узел</p><table><thead><tr><th>Узел</th><th>Адрес</th><th>Средняя</th></tr></thead><tbody><tr><td>1</td><td class="mono">192.168.1.1</td><td>2 мс</td></tr><tr><td>2</td><td class="mono">10.0.0.1</td><td>8 мс</td></tr><tr><td>3</td><td class="mono">140.82.121.3</td><td>35 мс</td></tr></tbody></table><p class="small muted">Отсутствие ответа промежуточного узла само по себе не доказывает обрыв пути.</p>`);return;}
 if(action==='loadtest'){sheet(el,'Проверка под нагрузкой',`<p>Тест измеряет скорость скачивания, отправки и рост задержки.</p><div class="insight">Расход трафика — до 350 МБ плюс данные, которые уже передаются.</div><p class="small muted">Макет показывает результат без загрузки данных.</p>${act('load-result','Показать пример результата','primary')}`);return;}
 if(action==='load-result'){sheet(el,'Результат под нагрузкой',`<span class="badge">Пример</span><div class="keyvals"><div class="keyval"><span class="key">Скачивание / отправка</span><h2>94 / 48 Мбит/с</h2></div><div class="keyval"><span class="key">Задержка без нагрузки / под нагрузкой</span><h2>42 / 86 мс</h2></div></div><p class="muted">При загрузке задержка выросла на 44 мс.</p><p class="small muted">В полном интерфейсе: оценки для игр, звонков и видео, потери и разброс задержки.</p>`);return;}
 if(action==='notify'){sheet(el,'Уведомления о связи',`<p>${apps[s.app].name}</p><label class="checkline"><input type="checkbox" checked>Сообщать, когда сервер перестал отвечать и когда ответы вернулись</label><label class="checkline"><input type="checkbox">Применить ко всем программам</label><p class="small muted">Уведомления Windows. Настройки в макете не меняют систему.</p>${act('save-demo','Сохранить','primary')}`);return;}
 if(action==='block'){sheet(el,'Блокировка соединений',`<p>Выберите, что ограничить.</p><label>Что заблокировать<select><option>IP ${selectedRow(s).ip}</option><option>Программу ${apps[s.app].name}</option><option>Домен</option><option>Сеть владельца</option><option>Службу Windows</option></select></label><label>Для кого<select><option>Только для ${apps[s.app].name}</option><option>Для всех программ</option></select></label><div class="insight">Правило останется после закрытия NetWatcher. Общий IP может использоваться другими сайтами.</div><p class="small muted">В макете правила брандмауэра не создаются.</p>${act('block-preview','Посмотреть правило','primary')}`);return;}
 if(action==='block-preview'){sheet(el,'Правило перед блокировкой',`<p>Пример: запрет исходящих соединений ${apps[s.app].name} с ${selectedRow(s).ip}.</p><pre class="preview">Направление: исходящие\nДействие: запретить\nУдалённый IP: ${selectedRow(s).ip}\nПрограмма: ${apps[s.app].exe}</pre><p class="small muted">Следующий шаг в программе — подтверждение с командой брандмауэра. Здесь показан только макет.</p>${act('save-demo','Готово','primary')}`);return;}
 if(action==='disconnect'){sheet(el,'Разорвать соединение?',`<p>Программа может подключиться снова. Действие доступно для TCP по IPv4.</p><p class="small muted">В макете соединения не закрываются.</p>${act('save-demo','Понятно','primary')}`);return;}
 if(action==='unblock'){btn.closest('[data-rule]').remove();toast(el,'Правило скрыто в макете. Брандмауэр Windows не изменён.');return;}
 if(action==='rdap'||action==='peering'){sheet(el,action==='rdap'?'Данные реестра IP':'Владелец сети',`<span class="badge">Пример данных</span><p>${action==='rdap'?'Здесь появятся диапазон адресов, организация и контакты регистратора.':'Здесь появятся название и тип сети из PeeringDB.'}</p><p class="small muted">Это разные источники сведений. Запрос выполняется по вашей команде в программе.</p>`);return;}
 if(action==='windows-history'){sheet(el,'Трафик по данным Windows',`<p class="muted">${apps[s.app].name} · отдельный источник</p><label>Период<select><option>30 дней</option><option>7 дней</option><option>Сутки</option></select></label><h2>12,4 ГБ <span class="small muted">в примере</span></h2><p class="small muted">Включает время до установки NetWatcher. Экспериментальная функция.</p>`);return;}
 if(action==='program-filter'){sheet(el,'Список программ',`<label>Порядок<select><option>По активности</option><option>По имени</option><option>По трафику</option></select></label><label>Показывать<select><option>Программы и службы</option><option>Приложения</option><option>Службы Windows</option></select></label><p class="small muted">Поля показывают настройки будущего списка. В макете поиск программ работает в левой панели.</p>${act('close-sheet','Готово','primary')}`);return;}
 if(action==='help'){sheet(el,'Что можно сделать',`<div class="stack"><p>В «Программах» выберите приложение или службу. На вкладке «Связь» видны задержки и пропуски ответов.</p><p>Нажмите на адрес, чтобы узнать владельца, проверить соединение или открыть действия.</p><p>«Экспорт списка» сохраняет адреса для VPN, роутера или брандмауэра.</p><p class="small muted">Все значения в этих макетах приведены для примера.</p></div>`);return;}
 if(action==='folder'){toast(el,'В программе откроется папка '+apps[s.app].exe);return;}
 if(['save-demo','save-settings'].includes(action)){el.querySelector('.overlay')?.remove();toast(el,'Выбор сохранён только в макете');return;}
 if(action==='update-db'||action==='update-app'){toast(el,'Показан макет. Загрузка и проверка обновлений не запускаются.');return;}
});
root.addEventListener('change',e=>{
 const el=e.target.closest('.nw');if(!el)return;const s=state.a;const field=e.target.dataset.select;
 if(field==='theme'){s.theme=e.target.value;render('a');remember();return;}
 if(field==='group'){s.group=e.target.value;render('a');return;}
 if(field==='scope'){s.scope=e.target.value;s.checked=[];render('a');return;}
 if(field==='period'&&e.target.value){s.period=e.target.value;render('a');toast(el,'Период изменён. Данные в макете приведены для примера.');return;}
 if(field?.startsWith('export-')||e.target.dataset.input?.startsWith('export-')){updateExport(el,s);return;}
 if(e.target.hasAttribute('data-check-row')){const id=Number(e.target.dataset.checkRow);s.checked=e.target.checked?[...new Set([...s.checked,id])]:s.checked.filter(x=>x!==id);refreshTable(el,s);return;}
 if(e.target.hasAttribute('data-check-all')){s.checked=e.target.checked?filteredRows(s).map(r=>r.id):[];refreshTable(el,s);}
});
root.addEventListener('input',e=>{
 const el=e.target.closest('.nw');if(!el)return;const s=state.a;
 if(e.target.dataset.input==='query'){s.query=e.target.value;s.checked=[];refreshTable(el,s);}
 if(e.target.dataset.input==='program'){el.querySelectorAll('[data-app-name]').forEach(b=>b.hidden=!b.dataset.appName.toLowerCase().includes(e.target.value.toLowerCase()));}
});
root.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-resize-programs]');if(!handle)return;
 const layout=handle.closest('.data-layout');if(window.innerWidth<=850)return;
 const start=e.clientX,initial=layout.querySelector('.program-panel').getBoundingClientRect().width;
 const max=Math.max(190,Math.min(330,layout.clientWidth-365));
 const move=ev=>{state.a.programWidth=Math.max(190,Math.min(max,Math.round(initial+ev.clientX-start)));layout.style.setProperty('--program-width',state.a.programWidth+'px');};
 const end=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);remember();};
 document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);e.preventDefault();
});
root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){const input=root.querySelector('[data-input="query"]');if(input){e.preventDefault();input.focus();}}});

root.addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.closest('.nw')?.querySelector('.overlay')?.remove();}});
render('a');
if(globalThis.Tweak){for(const id of ['a']){const el=document.getElementById('nw-'+id);const design={accent:id==='a'?'#7644c2':'#67dcdb',radius:id==='a'?12:6};const apply=()=>{el.style.setProperty('--accent',design.accent);el.querySelectorAll('.panel').forEach(p=>p.style.borderRadius=design.radius+'px');};const tweak=new Tweak({container:el,onChange:apply});tweak.addColorPicker(design,'accent',{label:'Акцент',reference:'--accent'});tweak.addSlider(design,'radius',{label:'Скругление панелей',min:0,max:20,unit:'px'});}}
})();
</script>
