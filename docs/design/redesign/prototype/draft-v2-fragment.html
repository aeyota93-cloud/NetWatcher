const QUICK=[['tcp','TCP','Только TCP'],['udp','UDP','Только UDP: QUIC/HTTP3, звонки, игры, DNS'],['domain','С доменом','Адреса, для которых известен домен'],['nodomain','Без домена','Адреса, для которых домен не определён'],['bad','Проблемные','Адреса, которые не отвечают, подключаются с повторами, теряют пакеты или дают ошибки DNS'],['new','Только новые','Адреса, впервые замеченные у программы за последние сутки'],['tracker','Трекеры','Домены рекламы и аналитики из открытого списка'],['telemetry','Телеметрия','Адреса телеметрии и рекламы Windows из открытого списка'],['hidems','Скрыть Microsoft','Убрать обращения к сетям и доменам Microsoft'],['ipv4','Только IPv4','Скрыть адреса IPv6']];
const COLUMNS={address:['Домен и IP','По домену','По IP'],proto:['Все','TCP','UDP'],state:['Все','Сбоев не видно','Проблемы','Нет ответа','Простаивает'],lat:['Все','до 20 мс','20–50 мс','50–100 мс','от 100 мс','нет замера'],jit:['Все','до 10 мс','10–20 мс','от 20 мс','нет замера'],loss:['Все','Есть','Нет','Не измерены'],ans:['Все','Сейчас','Раньше','Не было'],min:['Все','Есть обмен','Без обмена']};
const noColumns=()=>({text:'',address:0,proto:0,state:0,lat:0,jit:0,loss:0,ans:0,min:0});
Object.assign(state.a,{qf:[],filtersOpen:false,sort:{key:'traffic',dir:-1},expanded:{},detailsHeight:230,chartExpanded:false,columns:noColumns(),programSort:'name',programList:''});
const known=r=>r.domain!==r.ip;
const mb=t=>{const m=/([\d,]+)\s*(ГБ|МБ)/.exec(t);return m?parseFloat(m[1].replace(',','.'))*(m[2]==='ГБ'?1024:1):0;};
const sizeText=v=>v>=1024?(v/1024).toFixed(1).replace('.',',')+' ГБ':Math.round(v)+' МБ';
const plural=(n,a,b,c)=>{const t=n%100,o=n%10;return t>10&&t<20?c:o===1?a:o>=2&&o<=4?b:c;};
connections.forEach(r=>{r.v6=r.ip.includes(':');r.isNew=/ads\.example|www\.google/.test(r.domain)||r.ip==='155.133.248.50';r.tracker=r.domain.startsWith('ads.example');r.telemetry=r.domain.includes('settings-win.data');r.ms=r.owner.includes('Microsoft');r.retries=r.ip==='149.154.175.50';if(r.retries)r.status='Повторы TCP · 46 мс';});
function quickPass(r,s){const on=k=>s.qf.includes(k);
 if(on('tcp')!==on('udp')&&r.protocol!==(on('tcp')?'TCP':'UDP'))return false;
 if(on('domain')!==on('nodomain')&&known(r)!==on('domain'))return false;
 if(on('bad')&&!(r.bad||r.retries))return false;
 if(on('new')&&!r.isNew)return false;
 if(on('tracker')&&!r.tracker)return false;
 if(on('telemetry')&&!r.telemetry)return false;
 if(on('hidems')&&r.ms)return false;
 if(on('ipv4')&&r.v6)return false;
 return true;}
function currentRows(s){return s.route==='connections'?connections:connections.filter(r=>r.appIndex===s.app);}
function selectedRow(s){return connections.find(r=>r.id===s.selectedId)||currentRows(s)[0];}
function filteredRows(s){const words=s.query.trim().toLowerCase().split(/\s+/).filter(Boolean);return currentRows(s).filter(r=>{const a=apps[r.appIndex];
 if(s.route==='connections'&&s.scope!=='all'&&a.type!==s.scope)return false;
 if(!quickPass(r,s))return false;
 const hay=[r.domain,r.ip,r.owner,r.protocol,r.rawPort,r.country,r.network,a.name,a.exe].join(' ').toLowerCase();
 return words.every(t=>/^\d+$/.test(t)?String(r.rawPort)===t:hay.includes(t));});}

function srv(r){const m=/(\d+) мс/.exec(r.status),lat=m?+m[1]:null,idle=!r.bad&&mb(r.traffic)<=1;return {r,lat,jit:lat==null?null:Math.max(1,Math.round(lat*.13)),loss:r.retries?3:lat==null?null:0,state:r.bad?'Нет ответа':r.retries?'Проблемы':idle?'Простаивает':'Сбоев не видно',ans:r.bad?'18 с назад':'сейчас',ansKind:r.bad?2:1,traffic:!idle&&!r.bad};}
function serverPass(v,s){const c=s.columns,r=v.r,t=c.text.trim().toLowerCase();
 if(!quickPass(r,s))return false;
 if(t&&![r.domain,r.ip,r.owner].join(' ').toLowerCase().includes(t))return false;
 if(c.address===1&&!known(r))return false;if(c.address===2&&known(r))return false;
 if(c.proto&&r.protocol!==COLUMNS.proto[c.proto])return false;
 if(c.state===2?!['Проблемы','Нет ответа'].includes(v.state):c.state&&v.state!==COLUMNS.state[c.state])return false;
 const band=(x,e)=>x==null?e.length+1:e.findIndex(b=>x<b)+1||e.length;
 if(c.lat&&band(v.lat,[20,50,100,1e9])!==c.lat)return false;
 if(c.jit&&band(v.jit,[10,20,1e9])!==c.jit)return false;
 if(c.loss===1&&!(v.loss>0))return false;if(c.loss===2&&v.loss!==0)return false;if(c.loss===3&&v.loss!=null)return false;

 return true;}

function appList(s,compact=false){const list=apps.map((a,i)=>({a,i})).sort((x,y)=>s.programSort==='traffic'?mb(y.a.traffic)-mb(x.a.traffic):s.programSort==='activity'?y.a.addr-x.a.addr:0);return `<div class="applist">${list.map(({a,i})=>`<button type="button" class="appitem ${s.app===i&&s.route==='apps'?'selected':''}" data-act="app:${i}" data-app-name="${esc(a.name+' '+a.exe)}"><span class="identity">${avatar(a)}<span><strong>${a.name}</strong><span class="small muted">${a.exe}</span></span></span><span class="right"><b>${a.traffic}</b><br><span class="small ${i===0?'attention':'muted'}">${i===0?'Нет ответа':a.addr+' соед.'}</span></span></button>`).join('')}</div>`;}
function appsPage(s){const a=apps[s.app];return `<div class="heading compact-heading"><div><h1>Программы</h1><p>Соединения и связь выбранной программы.</p></div><div class="row">${act('toggle-list',s.listHidden?'Показать список':'Скрыть список','','panel-left')}${act('export','Экспорт списка','primary','arrow-up-from-line')}</div></div><div class="data-layout ${s.listHidden?'list-hidden':''}" style="--program-width:${s.programWidth}px"><section class="panel program-panel" aria-label="Список программ"><div class="program-title"><h2>Программы и службы</h2><div class="row">${copyButton('narrow-list','Сузить список','chevron-left')}${copyButton('widen-list','Расширить список','chevron-right')}</div></div><div class="program-search"><div class="search">${icon('search')}<input data-input="program" aria-label="Найти программу или службу" placeholder="Найти программу"></div><select class="program-sort" data-select="program-sort" aria-label="Порядок списка программ"><option value="name" ${s.programSort==='name'?'selected':''}>По имени</option><option value="activity" ${s.programSort==='activity'?'selected':''}>По активности</option><option value="traffic" ${s.programSort==='traffic'?'selected':''}>По трафику</option></select></div>${appList(s,true)}<div class="program-foot small muted">6 программ и служб · примеры</div></section><div class="splitter" role="separator" aria-orientation="vertical" aria-label="Изменить ширину списка программ" data-resize-programs>${icon('grip-vertical')}</div><div class="workspace" style="${sizeVars(s)}"><section class="panel"><div class="program-summary"><div class="row">${avatar(a)}<div><h2>${a.name}</h2><span class="small muted">${a.exe} · ${a.addr} соединений в примере</span></div></div><div class="row">${act('notify','Уведомления','ghost','bell')}${act('app-menu','Действия','','ellipsis')}</div></div><div class="program-metrics"><span>Трафик <b>${a.traffic}</b></span><span>Задержка <b>${s.app===0?'42':'28'} мс</b></span><span>Потери проб <b>${s.app===0?'—':'0%'}</b></span>${s.app===0?'<span class="badge warn">1 сервер без ответа</span>':'<span class="badge"><span class="dot"></span>Ответы приходят</span>'}</div>${tabsBar(s)}${s.tab==='link'?linkProgram(s):s.tab==='dns'?dnsTable(s):searchBar(s)+addressTable(s)}</section>${s.tab==='dns'?'':detailsBlock(s)}<div class="contextbar bottom-context"><div class="row">${live(s)}</div>${periods(s)}</div></div></div>${footer(s)}`;}
function connectionsPage(s){return `<div class="heading compact-heading"><div><h1>Все соединения</h1><p>Общий список приложений и служб Windows.</p></div>${act('export','Экспорт списка','primary','arrow-up-from-line')}</div><div class="contextbar"><span class="scope-info">${connections.length} соединений · ${apps.length} программ и служб</span>${periods(s)}</div><div style="${sizeVars(s)}"><section class="panel all-connections">${tabsBar(s)}${s.tab==='link'?linkOverview(s):s.tab==='dns'?dnsTable(s):searchBar(s,true)+addressTable(s)}</section>${s.tab==='addresses'?detailsBlock(s):''}</div><div class="contextbar bottom-context"><div class="row">${live(s)}</div><span class="small muted">Нажмите на программу, чтобы перейти к её соединениям</span></div>${footer(s)}`;}
/* Меню у курсора: для строки — как в 0.8.x, для сервера — без повторов (0.8.3). */
let ctxFresh=false;
function ctxMenu(el,x,y,items){el.querySelector('.ctx')?.remove();const box=el.getBoundingClientRect(),m=document.createElement('div');m.className='ctx';m.setAttribute('role','menu');m.innerHTML=items.map(i=>i==='-'?'<hr>':`<button type="button" role="menuitem" data-act="${i[1]}">${i[0]}</button>`).join('');el.append(m);const w=m.offsetWidth,h=m.offsetHeight;m.style.left=Math.max(4,Math.min(x-box.left,box.width-w-6))+'px';m.style.top=Math.max(4,Math.min(y-box.top,box.height-h-6))+'px';ctxFresh=true;m.querySelector('button')?.focus();}
function rowMenuItems(r,s){const tcp=r.protocol==='TCP'&&!r.v6;if(s.tab==='link')return [['Копировать IP:порт','copy-address'],['Найти в «Все соединения»','find-ip'],'-',['Заблокировать…','block'],...(tcp?[['Разорвать соединение…','disconnect']]:[])];return [['Копировать IP','copy-ip'],['Копировать домены','copy-domain'],['Копировать сеть владельца','copy-network'],['Копировать строку целиком','copy-row'],'-',['Найти всё с этим IP','find-ip'],['Найти всё с этим доменом','find-domain'],['Найти всё этой программы','find-program'],'-',['Проверить соединение…','check-address'],['Открыть папку программы','folder'],'-',['Заблокировать…','block'],...(tcp?[['Разорвать соединение…','disconnect']]:[])];}
const appMenuItems=()=>[['Найти всё этой программы','find-program'],['Открыть папку программы','folder'],'-',['Заблокировать…','block']];
function keepScroll(fn){const w=root.querySelector('.tablewrap'),top=w?w.scrollTop:0;fn();const n=root.querySelector('.tablewrap');if(n)n.scrollTop=top;}
root.addEventListener('click',e=>{if(ctxFresh){ctxFresh=false;return;}root.querySelectorAll('.ctx').forEach(m=>m.remove());});
root.addEventListener('click',e=>{if(e.target.closest('button,input,select,a,.ctx'))return;const tr=e.target.closest('tr[data-row-id]');if(!tr)return;state.a.selectedId=Number(tr.dataset.rowId);keepScroll(()=>render('a'));});
root.addEventListener('contextmenu',e=>{const tr=e.target.closest('tr[data-row-id]');if(!tr)return;e.preventDefault();const s=state.a,el=tr.closest('.nw'),r=connections.find(x=>x.id===Number(tr.dataset.rowId));s.selectedId=r.id;keepScroll(()=>render('a'));ctxMenu(el,e.clientX,e.clientY,rowMenuItems(r,s));ctxFresh=false;});
root.addEventListener('change',e=>{const s=state.a,key=e.target.dataset.column;if(key){s.columns[key]=Number(e.target.value);keepScroll(()=>render('a'));return;}if(e.target.dataset.select==='program-sort'){s.programSort=e.target.value;keepScroll(()=>render('a'));}});
root.addEventListener('input',e=>{if(e.target.dataset.input!=='column-text')return;const s=state.a,el=e.target.closest('.nw');s.columns.text=e.target.value;e.target.classList.toggle('on',!!s.columns.text);el.querySelector('[data-server-rows]').innerHTML=serverRows(s);el.querySelector('[data-link-tools]').outerHTML=linkTools(s);icons();});
root.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-resize-details]');if(!handle)return;const s=state.a,host=handle.parentElement,start=e.clientY,initial=s.detailsHeight;const move=ev=>{s.detailsHeight=Math.max(120,Math.min(420,initial-(ev.clientY-start)));host.style.setProperty('--details',s.detailsHeight+'px');host.style.setProperty('--table-max',Math.max(180,660-s.detailsHeight)+'px');};const end=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);};document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);e.preventDefault();});
/* На телефоне сначала видна таблица; список программ открывается кнопкой и закрывается после выбора. */
const narrow=()=>window.innerWidth<=560;
if(narrow())state.a.listHidden=true;
root.addEventListener('click',e=>{const b=e.target.closest('[data-act^="app:"]');if(b&&narrow()&&!state.a.listHidden){state.a.listHidden=true;render('a');}});
/* Для проверки и снимков: #apps/link/dark/0 задаёт раздел, вкладку, тему и программу. */
(()=>{const [route,tab,theme,app]=location.hash.slice(1).split('/');const s=state.a;if(route)s.route=route;if(tab)s.tab=tab;if(theme)s.theme=theme;if(app)s.app=Number(app);if(route)s.navCollapsed=['apps','connections'].includes(route);})();
render('a');
if(globalThis.Tweak){for(const id of ['a']){const el=document.getElementById('nw-'+id);const design={accent:id==='a'?'#7644c2':'#67dcdb',radius:id==='a'?12:6};const apply=()=>{el.style.setProperty('--accent',design.accent);el.querySelectorAll('.panel').forEach(p=>p.style.borderRadius=design.radius+'px');};const tweak=new Tweak({container:el,onChange:apply});tweak.addColorPicker(design,'accent',{label:'Акцент',reference:'--accent'});tweak.addSlider(design,'radius',{label:'Скругление панелей',min:0,max:20,unit:'px'});}}
})();
</script>
