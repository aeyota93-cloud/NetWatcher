name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0. Пусто — только сборка"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Тесты
        run: dotnet test tests/NetWatcher.Core.Tests -c Release

      # Справочные базы встраиваются в NetWatcher.exe, чтобы ничего не скачивать при первом запуске.
      # Сначала оригинальные источники, при неудаче — недельные копии из служебных релизов.
      # Если базу не удалось получить, программа соберётся без неё и скачает её сама.
      - name: Справочные базы
        shell: pwsh
        continue-on-error: true
        run: |
          $assets = "src/NetWatcher.App/Assets"
          $mirror = "https://github.com/${{ github.repository }}/releases/download"
          function Lines($path) {
            $gz = [IO.Compression.GZipStream]::new([IO.File]::OpenRead($path), [IO.Compression.CompressionMode]::Decompress)
            $reader = [IO.StreamReader]::new($gz); $n = 0
            while ($null -ne $reader.ReadLine()) { $n++ }
            $reader.Dispose(); return $n
          }
          function Fetch($name, $urls, $min) {
            $dst = "$assets/$name"
            foreach ($url in $urls) {
              try {
                Invoke-WebRequest $url -OutFile $dst -UseBasicParsing -TimeoutSec 180
                $n = Lines $dst
                if ($n -ge $min) { Write-Host "$name из $url, строк: $n"; return $true }
                Write-Host "Слишком мало строк ($n) в $url"
              } catch { Write-Host "Не удалось с $url : $_" }
            }
            Remove-Item $dst -ErrorAction SilentlyContinue
            Write-Host "::warning::$name не встроена"
            return $false
          }
          $ok = $true
          $ok = (Fetch "ip2asn-combined.tsv.gz" @("https://iptoasn.com/data/ip2asn-combined.tsv.gz", "$mirror/asn-db/ip2asn-combined.tsv.gz") 100000) -and $ok
          $now = (Get-Date).ToUniversalTime()
          $geo = @($now, $now.AddMonths(-1)) | ForEach-Object { "https://download.db-ip.com/free/dbip-country-lite-$($_.ToString('yyyy-MM')).csv.gz" }
          $ok = (Fetch "dbip-country-lite.csv.gz" (@($geo) + "$mirror/geo-db/dbip-country-lite.csv.gz") 100000) -and $ok
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/duckduckgo/tracker-blocklists/main/web/v6/extension-tds.json" -OutFile tds.json -UseBasicParsing
            Invoke-WebRequest "https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt" -OutFile spy.txt -UseBasicParsing
            python tools/build-catalog.py tds.json spy.txt "$assets/domain-catalog.tsv.gz"
            if ($LASTEXITCODE -ne 0) { throw "build-catalog.py: код $LASTEXITCODE" }
          } catch {
            Write-Host "Каталог не собран: $_"
            $ok = (Fetch "domain-catalog.tsv.gz" @("$mirror/catalog-db/domain-catalog.tsv.gz") 1000) -and $ok
          }
          if (-not $ok) { exit 1 }

      - name: Сборка NetWatcher.exe
        run: dotnet publish src/NetWatcher.App -c Release -r win-x64 -o artifacts/publish

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/NetWatcher.exe, README.md, THIRD-PARTY-NOTICES.md -DestinationPath artifacts/NetWatcher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatcher-win-x64
          path: artifacts/NetWatcher-win-x64.zip

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/NetWatcher-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NetWatcher-win-x64.zip" | Set-Content artifacts/NetWatcher-win-x64.zip.sha256 -Encoding ascii

      # Релиз по тегу v* или по ручному запуску с указанной версией (тег создаётся сам).
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NetWatcher ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/NetWatcher-win-x64.zip
            artifacts/NetWatcher-win-x64.zip.sha256
