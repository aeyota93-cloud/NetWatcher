name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0. Пусто — только сборка"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Тесты
        run: dotnet test tests/NetWatcher.Core.Tests -c Release

      # База владельцев IP встраивается в NetWatcher.exe, чтобы ничего не скачивать при первом запуске.
      # Сначала оригинал с iptoasn.com, при неудаче — недельная копия из релиза asn-db.
      # Если не получилось нигде, программа соберётся без встроенной базы.
      - name: База владельцев IP
        shell: pwsh
        continue-on-error: true
        run: |
          $dst = "src/NetWatcher.App/Assets/ip2asn-combined.tsv.gz"
          $sources = @(
            "https://iptoasn.com/data/ip2asn-combined.tsv.gz",
            "https://github.com/${{ github.repository }}/releases/download/asn-db/ip2asn-combined.tsv.gz"
          )
          foreach ($url in $sources) {
            try {
              Invoke-WebRequest $url -OutFile $dst -UseBasicParsing -TimeoutSec 120
              $gz = [IO.Compression.GZipStream]::new([IO.File]::OpenRead($dst), [IO.Compression.CompressionMode]::Decompress)
              $reader = [IO.StreamReader]::new($gz)
              $lines = 0
              while ($null -ne $reader.ReadLine()) { $lines++ }
              $reader.Dispose()
              if ($lines -gt 100000) { Write-Host "Встроена база из $url, строк: $lines"; exit 0 }
              Write-Host "Слишком мало строк ($lines) в $url"
            } catch {
              Write-Host "Не удалось с $url : $_"
            }
          }
          Remove-Item $dst -ErrorAction SilentlyContinue
          exit 1

      - name: Сборка NetWatcher.exe
        run: dotnet publish src/NetWatcher.App -c Release -r win-x64 -o artifacts/publish

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/NetWatcher.exe, README.md -DestinationPath artifacts/NetWatcher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatcher-win-x64
          path: artifacts/NetWatcher-win-x64.zip

      # Релиз по тегу v* или по ручному запуску с указанной версией (тег создаётся сам).
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NetWatcher ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/NetWatcher-win-x64.zip
