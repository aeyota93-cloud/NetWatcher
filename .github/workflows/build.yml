name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0. Пусто — только сборка"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Тесты
        run: dotnet test tests/NetWatcher.Core.Tests -c Release

      - name: Сборка NetWatcher.exe
        run: dotnet publish src/NetWatcher.App -c Release -r win-x64 -o artifacts/publish

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/NetWatcher.exe, README.md -DestinationPath artifacts/NetWatcher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatcher-win-x64
          path: artifacts/NetWatcher-win-x64.zip

      # Релиз по тегу v* или по ручному запуску с указанной версией (тег создаётся сам).
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NetWatcher ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/NetWatcher-win-x64.zip
