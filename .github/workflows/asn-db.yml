name: asn-db

# Раз в неделю кладёт свежую копию базы владельцев IP (iptoasn.com) в релиз "asn-db".
# Программа скачивает её отсюда в первую очередь: GitHub доступен там, откуда скачали саму программу.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать и проверить
        run: |
          curl -fsSL --retry 3 --max-time 180 -o ip2asn-combined.tsv.gz https://iptoasn.com/data/ip2asn-combined.tsv.gz
          gzip -t ip2asn-combined.tsv.gz
          lines=$(zcat ip2asn-combined.tsv.gz | wc -l)
          echo "Строк: $lines"
          test "$lines" -gt 100000

      - name: Опубликовать в релиз asn-db
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asn-db
          target_commitish: ${{ github.sha }}
          name: База владельцев IP (служебный)
          body: |
            Копия ip2asn-combined.tsv.gz с https://iptoasn.com, обновляется раз в неделю автоматически.
            NetWatcher скачивает её кнопкой «Обновить базу». Это не версия программы — программа в релизах v*.
          prerelease: true
          make_latest: false
          files: ip2asn-combined.tsv.gz
